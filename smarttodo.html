<!DOCTYPE html>
<html>
    <head>
        <title>Smart ToDo</title>
        <style>
            body{
                font-family:Arial;
                background:linear-gradient(to right,#667eea,#764ba2);
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;
                
            }
            .box{
                background:white;
                padding:20px;
                border-radius:15px;
                width:300px;
                text-align:center;
            }
            input{
                width:70%;
                padding:8px;

            }
            button{
                padding:8px;
                margin:3px;
                background:purple;
                color:white;
                border:none;
                cursor:pointer;
            }
            .active{
                background:blue;
                color:white;
            }
            li{
                list-style:none;
                margin:10px;
                padding:5px;
                background:#eee;
                display:flex;
                justify-content:space-between;
            }
            .done{
                text-decoration:line-through;
                color:gray;
            }
            .dark{
                background:#121212;
                color:white;
            }
            .dark.box{
                background:#1e1e1e;
            }
            .dark input{
                background:#333;
                color:white;
                border:1px solid #555;
            }
            .dark li{
                background:#2c2c2c;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <h2>Smart To-Do</h2>
            <p id="count"></p>
            <button id="modeBtn" onclick="toggleDark()">Dark Mode</button><br><br>
            <input type="text"id="search"placeholder="Search task...."onekeyup="showTasks()"><br><br>
            <button id="allBtn"onclick="setFilter('all')">All</button>
            <button id="doneBtn" onclick="setFilter('done')">Completed</button>
            <button id="pendingBtn" onclick="setFilter('pending')">Pending</button><br><br>
            <input type="text"id="task"placeholder="Enter task">
            <button onclick="addTask()">Add</button>
            <ul id="list"></ul>
        </div>
        <script>
            function toggleDark(){
                document.body.classList.toggle("dark");
                let btn=document.getElementById("modeBtn");

                if(document.body.classList.contains("dark")){
                    localStorage.setItem("mode","dark");
                    btn.innerText="LightMode";
                }else{
                    localStorage.setItem("mode","light");
                    btn.innerText="Dark Mode";
                }
            }

            let currentFilter='all';
            function setFilter(type){
                currentFilter=type;

                document.getElementById("allBtn").classList.remove("active");
                document.getElementById("doneBtn").classList.remove("active");
                document.getElementById("pendingBtn").classList.remove("active");

                if(type==="all"){
                    document.getElementById("allBtn").classList.add("active");
                }
                else if(type==="done"){
                    document.getElementById("doneBtn").classList.add("active");
                }
                else{
                    document.getElementById("pendingBtn").classList.add("active");
                }

                showTasks();
            }
            let tasks=JSON.parse(localStorage.getItem("tasks")) ||[];
            function showTasks(){
                let list=document.getElementById("list");
                list.innerHTML="";
                let search=document.getElementById("search").value.toLowerCase();
                tasks.forEach((task,index)=>{
                    
                    if(task.name.toLowerCase().includes(search)&&
                    (currentFilter==="all"||
                        (currentFilter==="done"&&task.done)||
                        (currentFilter==="pending"&&!task.done)
                    )

                ){
                    let li=document.createElement("li");
                    let text=document.createElement("span");
                    text.innerText=task.name;

                    if(task.done){
                        text.classList.add("done");
                    }

                    text.onclick=()=>{
                        tasks[index].done=!tasks[index].done;
                        saveTasks();

                    };

                    let edit=document.createElement("button");
                    edit.innerText="Edit";
                    edit.onclick=()=>{
                        let newTask=prompt("Edit your task:",task.name);
                        if(newTask!==null&& newTask!==""){
                            tasks[index].name=newTask;
                            saveTasks();
                        }
                    }
                    let del=document.createElement("button");
                    del.innerText="X";
                    del.onclick=()=>{
                        tasks.splice(index,1);
                        saveTasks();
                    };
                    li.appendChild(text);
                    li.appendChild(edit);
                    li.appendChild(del);
                    list.appendChild(li);
                }

                });

            }
            function addTask(){
                let input=document.getElementById("task");
                let value=input.value;

                if(value ===""){
                    alert("Enter task!");
                    return;
                }
                tasks.push({name:value,done:false});
                input.value="";
                saveTasks();
            }
            function saveTasks(){
                localStorage.setItem("tasks",JSON.stringify(tasks));
                showTasks();
            }
            showTasks();
            if(localStorage.getItem("mode")==="dark"){
                document.body.classList.add("dark");
            }

            let pending=tasks.filter(t=>!t.done).length;
            document.getElementById("count").innerText="you have" +pending+ "tasks left";

            if(tasks.length===0){
                list.innerHTML="<p>No tasks</p>";
            }
            setFilter("all");

        </script>
    </body>
</html>
